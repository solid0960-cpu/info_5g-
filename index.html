<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Электр тогунун 3д модели</title>
<style>
  :root { --bg:#0b1220; --card:rgba(30,41,59,.92); --text:#e2e8f0; --muted:#94a3b8; --accent:#38bdf8; --warn:#f87171; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; overflow:hidden; }
  #view { position:fixed; inset:0; }
  .panel { position:fixed; left:12px; bottom:12px; right:12px; max-width:420px; background:var(--card);
    border-radius:14px; padding:14px; backdrop-filter: blur(6px); }
  .title { position:fixed; top:12px; left:14px; right:14px; pointer-events:none; }
  .title h1 { margin:0; font-size:1.15rem; }
  .title p { margin:2px 0 0; color:var(--muted); font-size:.85rem; }
  label { display:flex; justify-content:space-between; font-size:.9rem; margin:8px 0 4px; }
  label b { color:var(--accent); }
  input[type=range] { width:100%; accent-color:var(--accent); }
  .row { display:flex; gap:8px; align-items:center; margin-top:10px; }
  button { background:var(--accent); color:#0b1220; border:0; border-radius:10px; padding:9px 14px;
    font-size:.95rem; font-weight:600; cursor:pointer; }
  button.off { background:#475569; color:#e2e8f0; }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px; text-align:center; }
  .stat { background:#0b1220; border-radius:10px; padding:8px 2px; }
  .stat span { display:block; color:var(--muted); font-size:.72rem; }
  .stat strong { font-size:1.05rem; }
  #warn { color:var(--warn); font-size:.85rem; font-weight:600; min-height:1.2em; margin-top:8px; }
</style>
</head>
<body>
<div id="view"></div>

<div class="title">
  <h1>⚡ ЭЛЕКТО ТОГУНУН 3Д МОДЕЛИ </h1>
  <p>айландырып жакындатып жана параметирин алмаштырсанар болот</p>
</div>

<div class="panel">
  <label>чыналуусу U <b id="uVal">12 В</b></label>
  <input type="range" id="u" min="1" max="24" step="1" value="12">
  <label>жарыктагы каршылык R <b id="rVal">24 Ом</b></label>
  <input type="range" id="r" min="1" max="100" step="1" value="24">
<div class="row"><button id="sw">чынжырын ажыратуу</button></div>
  <div class="stats">
    <div class="stat"><span>Ток I</span><strong id="iOut">0.50 А</strong></div>
    <div class="stat"><span>Кубаттуулук P</span><strong id="pOut">6.0 Вт</strong></div>
    <div class="stat"><span>Энергия/саат</span><strong id="eOut">0.006 кВт·ч</strong></div>
  </div>
  <div id="warn"></div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- Сцена ----------
const container = document.getElementById('view');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1220);
scene.fog = new THREE.Fog(0x0b1220, 14, 32);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 8, 11);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.49;
controls.minDistance = 5;
controls.maxDistance = 22;
controls.target.set(0, 0.5, 0);

// Свет
scene.add(new THREE.AmbientLight(0x8fa3c4, 0.55));
const sun = new THREE.DirectionalLight(0xffffff, 1.0);
sun.position.set(6, 12, 8);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -10; sun.shadow.camera.right = 10;
sun.shadow.camera.top = 10; sun.shadow.camera.bottom = -10;
scene.add(sun);

// Плата-основание
const board = new THREE.Mesh(
  new THREE.BoxGeometry(11, 0.4, 7.5),
  new THREE.MeshStandardMaterial({ color: 0x14532d, roughness: 0.7, metalness: 0.1 })
);
board.position.y = -0.2;
board.receiveShadow = true;
scene.add(board);
scene.add(new THREE.GridHelper(40, 40, 0x1e293b, 0x1e293b)).position.y = -0.41;

// ---------- Путь провода ----------
const X = 4, Z = 2.5, Y = 0.5;
const pts = [];
const step = 0.25;
for (let x = -X; x < X; x += step) pts.push(new THREE.Vector3(x, Y, -Z));
for (let z = -Z; z < Z; z += step) pts.push(new THREE.Vector3(X, Y, z));
for (let x = X; x > -X; x -= step) pts.push(new THREE.Vector3(x, Y, Z));
for (let z = Z; z > -Z; z -= step) pts.push(new THREE.Vector3(-X, Y, z));
const curve = new THREE.CatmullRomCurve3(pts, true, 'centripetal');

const wire = new THREE.Mesh(
  new THREE.TubeGeometry(curve, 400, 0.09, 10, true),
  new THREE.MeshStandardMaterial({ color: 0xb45309, roughness: 0.35, metalness: 0.85 })
);
wire.castShadow = true;
scene.add(wire);

// ---------- Батарея (слева) ----------
const battery = new THREE.Group();
const body = new THREE.Mesh(
  new THREE.CylinderGeometry(0.55, 0.55, 1.5, 32),
  new THREE.MeshStandardMaterial({ color: 0x1d4ed8, roughness: 0.4, metalness: 0.3 })
);
const capPlus = new THREE.Mesh(
  new THREE.CylinderGeometry(0.25, 0.25, 0.25, 24),
  new THREE.MeshStandardMaterial({ color: 0xdc2626, metalness: 0.7, roughness: 0.3 })
);
capPlus.position.y = 0.87;
const capMinus = new THREE.Mesh(
  new THREE.CylinderGeometry(0.4, 0.4, 0.12, 24),
  new THREE.MeshStandardMaterial({ color: 0x94a3b8, metalness: 0.8, roughness: 0.3 })
);
capMinus.position.y = -0.81;
battery.add(body, capPlus, capMinus);
battery.rotation.x = Math.PI / 2;
battery.position.set(-X, Y, 0);
battery.traverse(o => { if (o.isMesh) o.castShadow = true; });
scene.add(battery);

// ---------- Лампа (справа) ----------
const lampGroup = new THREE.Group();
lampGroup.position.set(X, Y, 0);
const lampBase = new THREE.Mesh(
  new THREE.CylinderGeometry(0.45, 0.55, 0.6, 24),
  new THREE.MeshStandardMaterial({ color: 0x64748b, metalness: 0.8, roughness: 0.35 })
);
lampBase.position.y = -0.1;
const glass = new THREE.Mesh(
  new THREE.SphereGeometry(0.85, 32, 24),
  new THREE.MeshPhysicalMaterial({ color: 0xffffff, transparent: true, opacity: 0.22,
    roughness: 0.05, transmission: 0.6 })
);
glass.position.y = 0.95;
const bulbMat = new THREE.MeshStandardMaterial({ color: 0x3b3b2a, emissive: 0xfde047, emissiveIntensity: 0 });
const filament = new THREE.Mesh(new THREE.SphereGeometry(0.38, 24, 18), bulbMat);
filament.position.y = 0.95;
const lampLight = new THREE.PointLight(0xfde047, 0, 12, 1.6);
lampLight.position.y = 1.1;
lampGroup.add(lampBase, filament, glass, lampLight);
scene.add(lampGroup);

// ---------- Выключатель (спереди) ----------
const swGroup = new THREE.Group();
swGroup.position.set(0, Y, Z);
const baseSw = new THREE.Mesh(
  new THREE.BoxGeometry(2.2, 0.3, 0.9),
  new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.6 })
);
baseSw.position.y = -0.1;
const postMat = new THREE.MeshStandardMaterial({ color: 0xcbd5e1, metalness: 0.9, roughness: 0.25 });
const postL = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, 0.4, 16), postMat);
const postR = postL.clone();
postL.position.set(-0.8, 0.2, 0);
postR.position.set(0.8, 0.2, 0);
const leverPivot = new THREE.Group();
leverPivot.position.set(-0.8, 0.42, 0);
const lever = new THREE.Mesh(
  new THREE.BoxGeometry(1.7, 0.1, 0.22),
  new THREE.MeshStandardMaterial({ color: 0xf1f5f9, metalness: 0.9, roughness: 0.2 })
);
lever.position.x = 0.85;
const knob = new THREE.Mesh(new THREE.SphereGeometry(0.16, 16, 12),
  new THREE.MeshStandardMaterial({ color: 0xef4444 }));
knob.position.set(1.6, 0.12, 0);
leverPivot.add(lever, knob);
swGroup.add(baseSw, postL, postR, leverPivot);
swGroup.traverse(o => { if (o.isMesh) o.castShadow = true; });
scene.add(swGroup);

// ---------- Заряды ----------
const N = 90;
const chargeMesh = new THREE.InstancedMesh(
  new THREE.SphereGeometry(0.1, 10, 8),
  new THREE.MeshBasicMaterial({ color: 0x38bdf8 }),
  N
);
scene.add(chargeMesh);
const phase = Array.from({ length: N }, (_, i) => i / N);
const dummy = new THREE.Object3D();

// ---------- Логика ----------
const uEl = document.getElementById('u');
const rEl = document.getElementById('r');
const swBtn = document.getElementById('sw');
let closed = true, U = 12, R = 24, I = 0, P = 0;
let leverAngle = 0, leverTarget = 0;

function recalc() {
  U = +uEl.value; R = +rEl.value;
  I = closed ? U / R : 0;
  P = U * I;
  document.getElementById('uVal').textContent = U + ' В';
  document.getElementById('rVal').textContent = R + ' Ом';
  document.getElementById('iOut').textContent = I.toFixed(2) + ' А';
  document.getElementById('pOut').textContent = P.toFixed(1) + ' Вт';
  document.getElementById('eOut').textContent = (P / 1000).toFixed(3) + ' кВт·ч';
  document.getElementById('warn').textContent =
    I > 5 ? '⚠ Большой ток! Предохранитель в реальной цепи сработал бы.' : '';
  swBtn.textContent = closed ? 'Разомкнуть цепь' : 'Замкнуть цепь';
  swBtn.className = closed ? '' : 'off';
  leverTarget = closed ? 0 : 0.95;
}
uEl.addEventListener('input', recalc);
rEl.addEventListener('input', recalc);
swBtn.addEventListener('click', () => { closed = !closed; recalc(); });
recalc();

// ---------- Цикл ----------
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  // рычаг
  leverAngle += (leverTarget - leverAngle) * Math.min(1, dt * 10);
  leverPivot.rotation.z = leverAngle;

  // лампа
  const b = closed ? Math.min(1, Math.sqrt(P / 120)) : 0;
  bulbMat.emissiveIntensity = b * 2.2;
  lampLight.intensity = b * 60;

  // заряды
  if (closed) {
    const speed = (0.01 + I * 0.012);
    for (let i = 0; i < N; i++) phase[i] = (phase[i] + speed * dt * 4) % 1;
  }
  for (let i = 0; i < N; i++) {
    dummy.position.copy(curve.getPointAt(phase[i]));
    dummy.updateMatrix();
    chargeMesh.setMatrixAt(i, dummy.matrix);
  }
  chargeMesh.instanceMatrix.needsUpdate = true;

  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
